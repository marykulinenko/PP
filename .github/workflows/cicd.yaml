name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config

      - name: Build images
        run: docker compose build --no-cache backend frontend

      - name: Start application
        run: docker compose up -d

      - name: Check backend health
        run: |
          for i in {1..30}; do
            if docker compose ps backend | grep -q "healthy"; then
              echo "Backend is healthy"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend did not become healthy"
          docker compose ps
          docker compose logs backend
          exit 1

      - name: Smoke test
        run: curl --fail http://localhost:8081/api/health

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag backend image
        run: |
          docker tag my-backend:latest ghcr.io/${{ github.repository_owner }}/pp-backend:${{ github.sha }}
          docker tag my-backend:latest ghcr.io/${{ github.repository_owner }}/pp-backend:latest

      - name: Tag frontend image
        run: |
          docker tag my-frontend:latest ghcr.io/${{ github.repository_owner }}/pp-frontend:${{ github.sha }}
          docker tag my-frontend:latest ghcr.io/${{ github.repository_owner }}/pp-frontend:latest

      - name: Push backend image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/pp-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/pp-backend:latest

      - name: Push frontend image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/pp-frontend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/pp-frontend:latest

      - name: Stop application
        if: always()
        run: docker compose down

  deploy:
    needs: build
    runs-on: self-hosted

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/pp-backend:${{ github.sha }}
          FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/pp-frontend:${{ github.sha }}
        run: docker compose pull

      - name: Deploy application
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/pp-backend:${{ github.sha }}
          FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/pp-frontend:${{ github.sha }}
        run: docker compose up -d --no-build

      - name: Check deployment
        run: docker compose ps